name: Release

# Portable archives: the binary plus README and licenses. ONNX Runtime, CUDA and the models are
# not bundled; `wessh setup` fetches the right ones for each machine, which keeps downloads tiny.
#
# Main builds artifacts; a Cargo.toml version bump also publishes a release after all checks pass.
# Version tags can still publish explicitly, and suffixes such as -rc.1 mark pre-releases.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  verify:
    name: verify version, lints and tests
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - name: detect release version
        id: version
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          release=false
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$BEFORE" != 0000000000000000000000000000000000000000 ]]; then
            git fetch --no-tags --depth=1 origin "$BEFORE"
            previous="$(git show "$BEFORE:Cargo.toml" | sed -n 's/^version = "\(.*\)"/\1/p' | head -n1)"
            [[ "$version" == "$previous" ]] || release=true
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}"
            exit 1
          fi
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: checks
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --profile ci --locked -- -D warnings
      - run: cargo test --workspace --profile ci --locked

  build:
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported Ubuntu keeps the glibc requirement low.
          - { name: Linux x64, artifact: linux-x64, target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { name: Linux ARM64, artifact: linux-arm64, target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { name: Windows x64, artifact: windows-x64, target: x86_64-pc-windows-msvc, os: windows-latest }
          - { name: macOS Apple Silicon, artifact: macos-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { name: macOS Intel, artifact: macos-x64, target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }} -p wessh
      - name: build Windows console executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $releaseDir = "target/${{ matrix.target }}/release"
          Copy-Item "$releaseDir/wessh.exe" "$releaseDir/wessh-gui.exe"
          cargo build --release --locked --target ${{ matrix.target }} -p wessh --features console
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$releaseDir/wessh.exe" "$releaseDir/wessh-cli.exe"
          Move-Item -Force "$releaseDir/wessh-gui.exe" "$releaseDir/wessh.exe"
      - name: locate Windows installer compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          $compilerPath = if ($compiler) { $compiler.Source } else { Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe' }
          if (-not (Test-Path $compilerPath)) { throw 'Inno Setup compiler is missing from the runner' }
          "ISCC=$compilerPath" >> $env:GITHUB_ENV
      - name: prepare standalone Linux packaging
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y file curl ca-certificates libx11-6 libxcursor1 libxrandr2 libxi6 libxinerama1 libxrender1 libxfixes3 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libwayland-cursor0 libwayland-egl1
          arch="${{ matrix.target }}"
          arch="${arch%%-*}"
          tools="$RUNNER_TEMP/appimage-tools"
          mkdir -p "$tools"
          curl -fL --retry 3 "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-$arch.AppImage" -o "$tools/linuxdeploy"
          curl -fL --retry 3 "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-$arch.AppImage" -o "$tools/appimagetool"
          chmod +x "$tools/linuxdeploy" "$tools/appimagetool"
          echo "LINUXDEPLOY=$tools/linuxdeploy" >> "$GITHUB_ENV"
          echo "APPIMAGETOOL=$tools/appimagetool" >> "$GITHUB_ENV"
      - name: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            scripts/package.sh "${{ matrix.target }}" "$GITHUB_REF_NAME"
          else
            scripts/package.sh "${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: wessh-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  linux-portability:
    name: AppImage on ${{ matrix.image }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, fedora:43, archlinux:latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: wessh-linux-x64
          path: dist
      - name: launch standalone application
        env:
          TEST_IMAGE: ${{ matrix.image }}
        run: |
          chmod +x dist/*.AppImage
          docker run --rm -v "$PWD:/work:ro" "$TEST_IMAGE" sh -ec '
            if command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y xvfb xauth libgl1-mesa-dri libgl1
            elif command -v dnf >/dev/null; then
              dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth mesa-dri-drivers mesa-libGL
            else
              pacman -Syu --noconfirm xorg-server-xvfb xorg-xauth mesa libglvnd
            fi
            bash /work/scripts/linux/smoke-test.sh /work/dist/wessh-linux-x86_64.AppImage
          '

  publish:
    needs: [verify, build, linux-portability]
    if: startsWith(github.ref, 'refs/tags/') || needs.verify.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        working-directory: dist
        run: sha256sum wessh-* > SHA256SUMS
      # Published right away: the installers fetch the latest published release.
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          tag_name: v${{ needs.verify.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
