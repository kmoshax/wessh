[package]
name = "wajh"
version = "0.1.0"
edition = "2024"
description = "Real-time face swap in Rust"

[dependencies]
# ONNX Runtime is loaded at runtime (no multi-GB binaries baked into the build).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic", "api-26", "cuda", "tensorrt", "lax-feature-matching"] }
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1.10"
crossbeam-channel = "0.5"
parking_lot = "0.12"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
