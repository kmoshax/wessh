[package]
name = "wessh-vcam"
description = "Virtual camera output: v4l2loopback on Linux, Media Foundation on Windows 11 (media source DLL and client)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Build the media source the Windows camera frame server loads (`DllGetClassObject`). Only the
# DLL build enables it: `cargo rustc -p wessh-vcam --lib --crate-type cdylib --features source`.
source = []

[dependencies]
thiserror.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
v4l.workspace = true

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# The workspace lints, except that `unsafe` is denied rather than forbidden, so the Windows
# modules (COM and Win32) can allow it; every unsafe block says why it is sound.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
unreadable_literal = "allow"
